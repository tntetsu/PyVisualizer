name: Deploy to GitHub Pages

# main への push と手動実行で公開する（docs/development-plan.md 6 節の決定 5・6.2 節）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 共通の土台（兄弟リポジトリ）は、ブランチの最新ではなくタグで固定して参照する（docs/multilang-plan.md 3.1 節）。
# 土台を変えたら、兄弟リポジトリに新しいタグを付けて、ここを書き換える。
env:
  INTERP_CORE_REF: multilang-core-2026.11.25.2     # JSInterpreter の feature/interp-core（共通コア）
  INTERP_MASTER_REF: multilang-master-2026.11.25.2 # JSInterpreter の master（JS のエンジンの bundle を作る）
  VISUALIZER_REF: multilang-2026.11.25           # JSVisualizer の feature/multilang（言語プロファイルの画面）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# ビルドとデプロイを別のジョブにする（GitHub の Pages 用の標準のワークフローと同じ形）。
# 1 つのジョブで続けて行うと、アップロードした直後の成果物が deploy-pages から見えず、
# 「No artifacts named "github-pages"」で失敗することがあった（2026-11-25 に 2 回）。
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PyVisualizer
        uses: actions/checkout@v5

      # package.json の file: 参照に合わせて、兄弟リポジトリを取得する（上の env のタグ）
      # - js-interpreter: JSInterpreter の作業ブランチ feature/interp-core（共通コア）
      # - js-visualizer:  JSVisualizer の作業ブランチ feature/multilang（言語プロファイル）
      # - JSVisualizer の JS のエンジン（web/interpreter.bundle.js）は JSInterpreter の master から作る（テストが import する）
      - name: Clone sibling repositories
        run: |
          git clone --depth 1 --branch "$INTERP_CORE_REF" https://github.com/tntetsu/JSInterpreter.git ../JSInterpreter-core
          git clone --depth 1 --branch "$INTERP_MASTER_REF" https://github.com/tntetsu/JSInterpreter.git ../JSInterpreter
          git clone --depth 1 --branch "$VISUALIZER_REF" https://github.com/tntetsu/JSVisualizer.git ../JSVisualizer-multilang

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python（CPython との比較テスト用）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSVisualizer dependencies and build its JS engine bundle
        working-directory: ../JSVisualizer-multilang
        run: |
          npm ci
          npm run build:interp

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: node scripts/build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
